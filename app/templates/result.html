<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .result-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        .result-container p {
            font-size: 16px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="result-container">
    <h2>Вы ввели следующие данные:</h2>
    <p><strong>Имя:</strong> {{ name }}</p>
    <p><strong>Фамилия:</strong> {{ surname }}</p>
    <p><strong>Номер телефона:</strong> {{ phone }}</p>
    <p><strong>Дата рождения:</strong> {{ birth_date }}</p>
    <p><strong>Email:</strong> {{ email }}</p>
    <p><strong>Профессия:</strong> {{ profession }}</p>
    <p><strong>Стаж работы:</strong> {{ experience }} лет</p>
</div>

</body>
</html>
