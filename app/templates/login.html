<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background-color: gray;
            cursor: not-allowed;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .register {
            margin-top: 10px;
            display: block;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Вход</h2>
        <input type="email" id="email" placeholder="Введите почту" required>
        <p id="error-message" class="error"></p>
        <button id="login-button" disabled>Войти</button>
        <a href="http://localhost:8000/register" class="register">Зарегистрироваться</a>
    </div>

    <script>
        const emailInput = document.getElementById("email");
        const loginButton = document.getElementById("login-button");
        const errorMessage = document.getElementById("error-message");

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        emailInput.addEventListener("input", () => {
            if (validateEmail(emailInput.value)) {
                loginButton.disabled = false;
                errorMessage.textContent = "";
            } else {
                loginButton.disabled = true;
                errorMessage.textContent = "Введите корректный email";
            }
        });

        loginButton.addEventListener("click", async () => {
            const email = emailInput.value;

            try {
                const response = await fetch("http://localhost:8000/api/user/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok && data.id && data.role !== undefined) {
                    localStorage.setItem("user_id", data.id);
                    localStorage.setItem("user_role", data.role);

                    alert("Вход успешен! Ваш user_id и role сохранены.");
                    window.location.href = "http://localhost:8000/";
                } else {
                    alert(data.message || "Ошибка входа");
                }
            } catch (error) {
                console.error("Ошибка:", error);
                alert("Ошибка подключения к серверу");
            }
        });
    </script>

</body>
</html>
