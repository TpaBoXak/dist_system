<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            background-color: #007bff;
            padding: 10px;
        }
        .tab {
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
        }
        .tab:hover {
            background-color: #0056b3;
        }
        .active-tab {
            background-color: #0056b3;
        }
        .hidden {
            display: none;
        }
        .result-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: white;
            text-align: left;
        }
        .project-list {
            margin-top: 20px;
        }
        .add-project-form {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="tabs">
    <div class="tab active-tab" data-tab="workers">Работники</div>
    <div class="tab" data-tab="gips">ГИПы</div>
    <div class="tab" data-tab="projects">Проекты</div>
</div>

<div class="result-container">
    <h2>Вы ввели следующие данные:</h2>
    <p><strong>Имя:</strong> <span id="name"></span></p>
    <p><strong>Фамилия:</strong> <span id="surname"></span></p>
    <p><strong>Номер телефона:</strong> <span id="phone"></span></p>
    <p><strong>Дата рождения:</strong> <span id="birth_date"></span></p>
    <p><strong>Email:</strong> <span id="email"></span></p>

    <div id="workers" class="hidden">
        <p><strong>Профессии и стаж работы:</strong></p>
        <ul id="profession-list"></ul>
    </div>

    <div id="gips" class="hidden">
        <p><strong>Количество проектов:</strong> <span id="projects-count"></span></p>
    </div>

    <div id="projects" class="hidden">
        <h3>Проекты:</h3>
        <div class="project-list">
            <ul id="project-list"></ul>
        </div>
        <button id="add-project-button" class="hidden">Добавить проект</button>
        <div class="add-project-form" id="add-project-form">
            <h4>Добавить новый проект</h4>
            <label for="project-title">Название проекта:</label>
            <input type="text" id="project-title" required><br><br>
            <label for="project-desc">Описание проекта:</label>
            <textarea id="project-desc" required></textarea><br><br>
            <label for="project-workers">Выберите работников:</label>
            <select id="project-workers" multiple></select><br><br>
            <button id="submit-project">Сохранить проект</button>
        </div>
    </div>
</div>

<script>
    const userRole = localStorage.getItem("user_role");
    const userId = localStorage.getItem("user_id");

    document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", function() {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active-tab"));
            this.classList.add("active-tab");
            
            document.querySelectorAll(".result-container > div").forEach(div => div.classList.add("hidden"));
            document.getElementById(this.getAttribute("data-tab")).classList.remove("hidden");
            
            if (this.getAttribute("data-tab") === "projects" && userRole == 3) {
                document.getElementById("add-project-button").classList.remove("hidden");
            } else {
                document.getElementById("add-project-button").classList.add("hidden");
            }
        });
    });

    document.getElementById("add-project-button").addEventListener("click", function() {
        document.getElementById("add-project-form").style.display = "block";
        fetch('http://localhost:8000/api/user/workers')
            .then(response => response.json())
            .then(data => {
                const workerSelect = document.getElementById("project-workers");
                workerSelect.innerHTML = '';
                data.workers.forEach(worker => {
                    const option = document.createElement("option");
                    option.value = worker.id;
                    option.textContent = worker.name;
                    workerSelect.appendChild(option);
                });
            })
            .catch(error => console.error('Ошибка при загрузке работников:', error));
    });

    document.getElementById("submit-project").addEventListener("click", function() {
        const title = document.getElementById("project-title").value;
        const description = document.getElementById("project-desc").value;
        const selectedWorkers = Array.from(document.getElementById("project-workers").selectedOptions)
            .map(option => option.value);

        const projectData = {
            title: title,
            description: description,
            workers: selectedWorkers
        };

        fetch('http://localhost:8000/api/projects', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(projectData)
        })
        .then(response => response.json())
        .then(data => {
            console.log('Проект успешно создан:', data);
            alert('Проект успешно создан!');
        })
        .catch((error) => {
            console.error('Ошибка при создании проекта:', error);
        });
    });

</script>

</body>
</html>
