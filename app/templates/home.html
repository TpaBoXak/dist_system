<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма ввода данных</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .form-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .form-container label {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Введите ваши данные</h2>
    <form id="dataForm" method="post" action="/submit" enctype="application/json">
        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" required pattern="[A-Za-zА-Яа-яЁё\s]+" title="Только буквы и пробелы">

        <label for="surname">Фамилия:</label>
        <input type="text" id="surname" name="surname" required pattern="[A-Za-zА-Яа-яЁё\s]+" title="Только буквы и пробелы">

        <label for="phone">Номер телефона:</label>
        <input type="tel" id="phone" name="phone" required pattern="^\+7\(\d{3}\)\d{3}-\d{2}-\d{2}$" title="Формат: +7(XXX)XXX-XX-XX">

        <label for="birth_date">Дата рождения:</label>
        <input type="date" id="birth_date" name="birth_date" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="profession">Профессия:</label>
        <input type="text" id="profession" name="profession" required>

        <label for="experience">Стаж работы (в годах):</label>
        <input type="number" id="experience" name="experience" required min="0">

        <button type="submit">Отправить</button>
    </form>
</div>

<script>
    document.getElementById('dataForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const formData = new FormData(this);
        const data = {};
        formData.forEach((value, key) => {
            data[key] = value;
        });
        fetch('/api/user/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        })
        .then(response => response.text())
        .then(html => {
            document.body.innerHTML = html;
        })
        .catch(error => console.error('Ошибка:', error));
    });
</script>

</body>
</html>
